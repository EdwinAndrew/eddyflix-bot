name: Build

# Every push to main and every pull request builds the image and checks that the
# bot imports. Pushes to main publish sha-<commit>; a vX.Y.Z tag publishes X.Y.Z,
# which is what the server pins.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: eddyflix-bot:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Importing runs all module-level setup (commands, movie night roles list)
      # without connecting to Discord, which only happens under __main__.
      - name: The bot imports
        run: docker run --rm --entrypoint python eddyflix-bot:test -c "import bot, movie_night; print('ok:', len(movie_night.FLAIRS), 'flairs')"

      - name: Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
